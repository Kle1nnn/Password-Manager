<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;600;800&family=Chakra+Petch:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 320px;
    min-height: 420px;
    font-family: 'Chakra Petch', 'Space Mono', monospace;
    background: #03020c;
    overflow: hidden;
    position: relative;
    color: #c9d3e6;
  }

  .space-bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 30% 40%, #0a0a1a, #010005);
    z-index: 0;
  }

  .galaxy {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 70% 50%, rgba(45, 45, 100, 0.2) 0%, rgba(0,0,0,0) 70%),
                radial-gradient(ellipse at 20% 60%, rgba(80, 60, 130, 0.15) 0%, transparent 80%);
    z-index: 0;
    pointer-events: none;
  }

  .nebula {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .nebula-cloud {
    position: absolute;
    border-radius: 50%;
    filter: blur(55px);
    opacity: 0.35;
    animation: floatNebula 20s ease-in-out infinite alternate;
  }
  .cloud1 {
    width: 240px; height: 160px;
    top: -50px; left: -80px;
    background: radial-gradient(circle, #5b4b8c, #2a2a5a);
    animation-duration: 22s;
  }
  .cloud2 {
    width: 180px; height: 140px;
    bottom: 20px; right: -60px;
    background: radial-gradient(circle, #6c5b9e, #2e2b4a);
    animation-duration: 19s;
    animation-delay: -4s;
  }
  .cloud3 {
    width: 200px; height: 120px;
    top: 40%; left: 10%;
    background: radial-gradient(circle, #3d5a80, #1e2a4a);
    opacity: 0.3;
    animation-duration: 25s;
    animation-delay: -9s;
  }
  .cloud4 {
    width: 160px; height: 200px;
    bottom: -30px; left: -30px;
    background: radial-gradient(circle, #6b4b6e, #2a1f3a);
    opacity: 0.3;
    animation-duration: 20s;
    animation-delay: -2s;
  }
  @keyframes floatNebula {
    0% { transform: translate(0, 0) scale(1); filter: blur(50px); }
    100% { transform: translate(15px, -12px) scale(1.05); filter: blur(58px); }
  }

  .stars-layer {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    animation: twinkle var(--duration) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: var(--min-opacity); transform: scale(1); }
    100% { opacity: 1; transform: scale(1.2); }
  }

  /* Very rare shooting star – soft white */
  .shooting-star {
    position: absolute;
    top: -5%;
    left: -10%;
    width: 1.5px;
    height: 1.5px;
    background: #e0e6ff;
    box-shadow: 0 0 3px 0.5px rgba(200,210,255,0.5);
    animation: shoot 7s linear infinite;
    opacity: 0;
    z-index: 3;
  }
  @keyframes shoot {
    0% { transform: translate(0,0) rotate(40deg) scaleY(1); opacity: 0; }
    10% { opacity: 0.7; }
    30% { transform: translate(380px, 280px) rotate(40deg) scaleY(2); opacity: 0; }
    100% { transform: translate(380px, 280px) rotate(40deg) scaleY(2); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 20;
    padding: 20px 18px;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .lock-icon {
    font-size: 28px;
    display: block;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 6px rgba(160, 180, 255, 0.4));
    animation: cosmicPulse 3.5s ease-in-out infinite alternate;
  }
  @keyframes cosmicPulse {
    0% { filter: drop-shadow(0 0 2px #9cabdf); }
    100% { filter: drop-shadow(0 0 12px #c0cbff); }
  }
  .title {
    font-family: 'Orbitron', monospace;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #b9c8ff, #95a5d9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    font-size: 8px;
    font-family: 'Space Mono', monospace;
    color: #7a85aa;
    letter-spacing: 1.2px;
  }

  /* Site badge – dim, space glass */
  .site-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(10, 8, 25, 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(120, 130, 180, 0.25);
    border-radius: 10px;
    padding: 8px 14px;
    margin-bottom: 18px;
  }
  .site-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #a1b3e0;
    box-shadow: 0 0 6px #8f9fd0;
    animation: pulseSoft 2.5s infinite;
  }
  @keyframes pulseSoft {
    0%, 100% { opacity: 0.6; box-shadow: 0 0 2px #9aadf0; }
    50% { opacity: 1; box-shadow: 0 0 8px #bcc9ff; }
  }
  .site-label { font-size: 9px; color: #8d98be; letter-spacing: 1.2px; }
  .site-value { font-family: 'Orbitron', monospace; font-size: 11px; color: #cbd5ff; }

  /* Inputs – dark, no bright borders */
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 1.4px;
    color: #9aa6cf;
    margin-bottom: 5px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    background: rgba(5, 3, 18, 0.7);
    border: 1px solid rgba(100, 110, 150, 0.4);
    border-radius: 10px;
    color: #e0e6ff;
    font-family: 'Chakra Petch', monospace;
    font-size: 13px;
    outline: none;
    backdrop-filter: blur(4px);
    transition: 0.2s;
  }
  input:focus {
    border-color: #7c8dc0;
    background: rgba(30, 25, 55, 0.7);
    box-shadow: 0 0 0 2px rgba(100, 120, 180, 0.2);
  }
  input::placeholder {
    color: #5a6385;
    opacity: 0.5;
  }

  /* Buttons – muted space colors, no neon */
  .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 30px;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.6px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
    backdrop-filter: blur(6px);
  }
  .btn-primary {
    background: linear-gradient(105deg, #2a2e55, #191e3a);
    color: #d1dafc;
    border: 1px solid rgba(140, 160, 220, 0.3);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .btn-primary:hover {
    background: linear-gradient(105deg, #363c68, #20253f);
    border-color: rgba(170, 190, 250, 0.5);
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: rgba(45, 55, 85, 0.6);
    border: 1px solid rgba(100, 120, 160, 0.5);
    color: #bdc6ed;
  }
  .btn-secondary:hover {
    background: rgba(60, 70, 105, 0.7);
    border-color: #8595c5;
    transform: translateY(-1px);
  }
  .btn-ghost {
    background: rgba(0, 0, 0, 0.4);
    color: #9aa7d0;
    border: 1px solid rgba(100, 110, 140, 0.35);
    font-size: 9px;
    margin-top: 6px;
  }
  .btn-ghost:hover {
    background: rgba(30, 30, 55, 0.6);
    border-color: #7c8aba;
  }

  /* Messages – subdued */
  .message {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    display: none;
    backdrop-filter: blur(8px);
  }
  .message.success {
    display: block;
    background: rgba(30, 60, 70, 0.4);
    border: 1px solid #6c8a9a;
    color: #bdd4e8;
  }
  .message.error {
    display: block;
    background: rgba(70, 40, 50, 0.4);
    border: 1px solid #aa7a8a;
    color: #ecccd6;
  }

  .divider {
    margin: 16px 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #5c6a8f, transparent);
  }

  .screen {
    animation: fadeUp 0.35s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #main-screen { display: none; }
</style>
</head>
<body>

<div class="space-bg"></div>
<div class="galaxy"></div>
<div class="nebula">
  <div class="nebula-cloud cloud1"></div>
  <div class="nebula-cloud cloud2"></div>
  <div class="nebula-cloud cloud3"></div>
  <div class="nebula-cloud cloud4"></div>
</div>
<div class="stars-layer" id="starsLayer"></div>
<div class="shooting-star" style="animation-delay: 0s;"></div>
<div class="shooting-star" style="animation-delay: 4s; left: -15%; top: 10%;"></div>

<div class="container">
  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="header">
      <span class="lock-icon">🪐</span>
      <div class="title">DEEP SPACE</div>
      <div class="subtitle">PASSWORD VAULT</div>
    </div>
    <div class="field">
      <label>MASTER KEY</label>
      <input type="password" id="master-pw" placeholder="Enter master password" />
    </div>
    <button class="btn btn-primary" id="login-btn">✦ UNLOCK ✦</button>
    <div id="login-error" class="message error"></div>
  </div>

  <!-- Main Screen -->
  <div id="main-screen" class="screen">
    <div class="header">
      <span class="lock-icon">🌙</span>
      <div class="title">STAR MAP</div>
    </div>
    <div class="site-badge">
      <div class="site-dot"></div>
      <div>
        <div class="site-label">CURRENT SITE</div>
        <div class="site-value" id="site-name">—</div>
      </div>
    </div>
    <div class="field">
      <label>USERNAME</label>
      <input type="text" id="username" placeholder="" />
    </div>
    <button class="btn btn-primary" id="get-btn">🔭 GET PASSWORD</button>
    <button class="btn btn-secondary" id="add-btn">✨ GENERATE & SAVE</button>
    <div class="divider"></div>
    <button class="btn btn-ghost" id="logout-btn">◈ LOCK VAULT</button>
    <div id="message" class="message"></div>
  </div>
</div>

<script src="popup.js"></script>
<script>
  // Generate stars (soft white, no color)
  const starsContainer = document.getElementById('starsLayer');
  const starCount = 160;
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.classList.add('star');
    const size = Math.random() * 2.2 + 0.5;
    const duration = (Math.random() * 3 + 1.5).toFixed(1);
    const minOp = (Math.random() * 0.35 + 0.1).toFixed(2);
    star.style.cssText = `
      width: ${size}px; height: ${size}px;
      top: ${Math.random() * 100}%; left: ${Math.random() * 100}%;
      --duration: ${duration}s;
      --min-opacity: ${minOp};
      animation-delay: -${(Math.random() * 5).toFixed(1)}s;
    `;
    starsContainer.appendChild(star);
  }
  // Very faint tiny stars
  for (let i = 0; i < 50; i++) {
    const tiny = document.createElement('div');
    tiny.classList.add('star');
    tiny.style.cssText = `
      width: 0.7px; height: 0.7px;
      top: ${Math.random() * 100}%; left: ${Math.random() * 100}%;
      --duration: ${(Math.random() * 2.5 + 1).toFixed(1)}s;
      --min-opacity: 0.2;
    `;
    starsContainer.appendChild(tiny);
  }
</script>
</body>
</html>
